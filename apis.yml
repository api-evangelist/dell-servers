aid: dell-servers
name: Dell Servers
description: >-
  APIs for managing and monitoring Dell PowerEdge servers and infrastructure, including the iDRAC Redfish out-of-band
  management interface, OpenManage Enterprise centralized console and its modular, power, support, and VMware
  integrations, telemetry streaming, the Lifecycle Controller, RACADM, and the legacy WSMan interface.
