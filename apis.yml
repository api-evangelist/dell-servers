- aid: dell-servers:dell-servers-idrac-telemetry-streaming
  name: Dell iDRAC Telemetry Streaming API
  description: >-
    Server-Sent Events (SSE) streaming API for real-time telemetry data from Dell PowerEdge servers via
    iDRAC. Provides continuous metric reports including power statistics, CPU and memory metrics, thermal
    sensor data, NIC statistics, and PSU metrics using the Redfish TelemetryService.
  image: https://www.dell.com/favicon.ico
  baseURL: https://{idrac-ip}/redfish/v1/SSE
  humanURL: >-
    https://www.dell.com/support/manuals/en-us/idrac9-lifecycle-controller-v4.x-series/idrac9_4.00.00.00_redfishapiguide_pub/server-sent-events?guid=guid-fc87fd01-2cff-4ae0-9714-1bd712bb5ce3&lang=en-us
