- aid: dell-servers:dell-servers-openmanage-integration-vmware-vcenter
  name: Dell OpenManage Integration for VMware vCenter API
  description: >-
    RESTful API for the OpenManage Integration for VMware vCenter (OMIVV), enabling automation of Dell
    PowerEdge server management within VMware environments. The API is compliant with OpenAPI Specification
    3.0.0 and supports firmware updates, inventory, and monitoring tasks.
  image: https://www.dell.com/favicon.ico
  baseURL: https://{omivv-server}/api
  humanURL: >-
