- aid: dell-servers:dell-servers-openmanage-enterprise-power-manager
  name: Dell OpenManage Enterprise Power Manager API
  description: >-
    RESTful API for monitoring and managing power consumption, thermal conditions, and energy costs across
    Dell PowerEdge server infrastructure. Power Manager is a plug-in to the OpenManage Enterprise console
    that provides power policies, capping, and reporting capabilities.
  image: https://www.dell.com/favicon.ico
  baseURL: https://{ome-server}/api
