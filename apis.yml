- aid: dell-servers:dell-servers-openmanage-enterprise-modular
  name: Dell OpenManage Enterprise Modular API
  description: >-
    RESTful API for managing Dell PowerEdge MX7000 modular chassis and its components including compute
    sleds, network devices, IOMs, and storage. OME-Modular shares a common codebase with OpenManage Enterprise
    and supports multi-chassis management with up to 20 chassis per group.
  image: https://www.dell.com/favicon.ico
  baseURL: https://{omem-server}/api
