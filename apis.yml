  - Thermal Monitoring
  properties:
  - type: Documentation
    url: >-
      https://www.dell.com/support/manuals/en-us/openmanage-enterprise-power-manager/pmp_3.1_apiguide/about-this-document
- aid: dell-servers:dell-servers-openmanage-enterprise-supportassist
  name: Dell OpenManage Enterprise SupportAssist API
  description: >-
    RESTful API for the OpenManage Enterprise SupportAssist plug-in that enables proactive and predictive
    monitoring of Dell PowerEdge servers. SupportAssist automates support case creation and parts dispatch
    for servers with ProSupport and ProSupport Plus entitlements.
  image: https://www.dell.com/favicon.ico
  baseURL: https://{ome-server}/api
