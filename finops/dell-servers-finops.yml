specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: Dell Servers
providerId: dell-servers
publisherName: Dell Inc.
serviceCategory: Hardware Infrastructure
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Hardware
  - Infrastructure
  - Server Management
  - Redfish
  - FinOps
  - FOCUS
description: 'FOCUS-aligned FinOps for Dell server-management APIs: there is no per-call API
  invoice. Spend is the sum of (a) the underlying PowerEdge hardware, (b) iDRAC license tier
  upgrades (Enterprise / Datacenter) per server, (c) OpenManage Enterprise plug-in licenses per
  managed node (Power Manager, SupportAssist, Update Manager, OMIVV, OMEM), and (d) Dell
  ProSupport / hardware-warranty SKUs. The APIs themselves are bundled with the firmware.'
sources:
  - https://developer.dell.com/apis/2978
  - https://www.dell.com/support/kbdoc/en-us/000178027/idrac-licenses
  - https://www.dell.com/en-us/dt/solutions/openmanage/index.htm
notes: No metered API billing. FinOps shape attributes spend to per-server hardware + license
  tiers + managed-node plug-in licenses. Per-license SKU pricing is channel-quoted and not public.
billingModel:
  pricingCategory: License + Hardware
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Adjustment
focusColumns:
  ServiceName: Dell PowerEdge Management
  ServiceCategory: Hardware Infrastructure
  ServiceSubcategory: Server Management
  ProviderName: Dell
  PublisherName: Dell Inc.
  InvoiceIssuerName: Dell Inc.
  PricingCategory: License + Hardware
  BillingCurrency: USD
  ChargeCategory: Purchase
meters:
  - name: managed_servers
    description: Count of PowerEdge servers under management. Drives iDRAC license counts and
      OpenManage Enterprise plug-in entitlements.
    unit: server
    aggregation: max
    dimensions:
      - model
      - generation
      - datacenter
  - name: idrac_license_tier
    description: iDRAC license tier per server (Express, Enterprise, Datacenter).
    unit: license
    aggregation: max
    dimensions:
      - tier
      - server
  - name: ome_plugin_licenses
    description: Active OpenManage Enterprise plug-in licenses (Power Manager, SupportAssist,
      Update Manager, OMIVV, OMEM) per managed node.
    unit: license
    aggregation: max
    dimensions:
      - plugin
      - node
  - name: api_requests
    description: Count of API calls against iDRAC / OME / OMIVV. Useful for capacity planning;
      not directly billable.
    unit: request
    aggregation: count
    dimensions:
      - api
      - device
  - name: telemetry_metrics
    description: Telemetry metrics streamed via the iDRAC Telemetry Streaming API. Useful for
      sizing downstream observability storage cost.
    unit: metric
    aggregation: sum
    dimensions:
      - device
      - metric_class
principles:
  - name: Visibility
    description: Use OpenManage Enterprise inventory plus Dell Premier order history to enumerate
      servers, license tiers, and plug-in entitlements. The OME API exposes managed-node and
      license information for programmatic reconciliation against the Dell invoice.
  - name: Allocation
    description: Tag servers by datacenter, rack, business unit, and workload in OME so iDRAC and
      plug-in license cost can be attributed to the consuming team or product.
  - name: Optimization
    description: Right-size iDRAC license tiers — only servers needing virtual console / telemetry
      streaming / group manager benefit from Enterprise/Datacenter. Consolidate OME plug-in
      licenses to the nodes that actually use the feature, and use SupportAssist proactively to
      reduce ProSupport ticket volume.
  - name: Accountability
    description: Designate an infrastructure / platform team owner for the Dell estate who reviews
      iDRAC license sprawl, OME plug-in coverage, and ProSupport renewal annually. Track
      cost-per-managed-server and cost-per-rack to spot optimization opportunities.
maintainers:
