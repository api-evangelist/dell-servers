openapi: 3.2.0
info:
  title: Dell Servers Dell OpenManage Enterprise Configuration API
  description: RESTful API for centralized management of Dell EMC servers, chassis, and storage through the OpenManage Enterprise console. Provides discovery, inventory, monitoring, alerting, firmware updates, configuration compliance, and lifecycle management of Dell PowerEdge infrastructure at scale. The API delivers JSON responses over HTTPS and follows OData v4 conventions.
  version: '4.0'
  contact:
    name: Dell Technologies Support
    url: https://www.dell.com/support
  termsOfService: https://i.dell.com/sites/csdocuments/Legal_Docs/en/us/api-terms-of-use_en.pdf
servers:
- url: https://{ome-server}/api
  description: OpenManage Enterprise API Server
  variables:
    ome-server:
      description: Hostname or IP address of the OpenManage Enterprise appliance
      default: ome-server.example.com
security:
- sessionAuth: []
tags:
- name: Configuration
  description: Server configuration templates and compliance baselines
paths:
  /TemplateService/Templates:
    get:
      operationId: listConfigurationTemplates
      summary: Dell Servers List configuration templates
      description: Retrieves the collection of server configuration templates that define desired BIOS, RAID, network, and iDRAC settings. Templates can be deployed to one or more servers for consistent configuration.
      tags:
      - Configuration
      responses:
        '200':
          description: Collection of configuration templates
          content:
            application/json:
              schema:
                type: object
                properties:
                  value:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConfigTemplate'
        '401':
          description: Unauthorized - invalid or expired session token
components:
  schemas:
    ConfigTemplate:
      type: object
      description: A server configuration template
      properties:
        Id:
          type: integer
          description: Unique template identifier
        Name:
          type: string
          description: Template name
        Description:
          type: string
          description: Template description
        ViewTypeId:
          type: integer
          description: Template view type
        TypeId:
          type: integer
          description: Template type identifier
        CreatedBy:
          type: string
          description: User who created the template
        CreatedDate:
          type: string
          format: date-time
          description: Timestamp when the template was created
        LastUpdatedBy:
          type: string
          description: User who last updated the template
        LastUpdatedDate:
          type: string
          format: date-time
          description: Timestamp of the last update
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: header
      name: X-Auth-Token
      description: Session token obtained from the POST /SessionService/Sessions endpoint. Must be included in the X-Auth-Token header of all authenticated requests.
externalDocs:
  description: OpenManage Enterprise RESTful API Guide
  url: https://www.dell.com/support/manuals/en-us/dell-openmanage-enterprise/ome_p_api_guide/overview?guid=guid-fc1c0585-795c-41fe-9957-977678be554f&lang=en-us
