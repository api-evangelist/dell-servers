name: Dell Servers iDRAC Redfish API Capabilities
description: >-
  Capabilities exposed by the Dell iDRAC Redfish REST API for out-of-band
  lifecycle management of Dell PowerEdge servers using the DMTF Redfish
  standard.
capabilities:
  - name: Get Service Root
    description: Retrieve the Redfish service root and links to top-level resources.
    operationId: getServiceRoot
    method: GET
    path: /
  - name: List Computer Systems
    description: List computer system resources managed by the iDRAC instance.
    operationId: listSystems
    method: GET
    path: /Systems
  - name: Get Computer System
    description: Retrieve detailed inventory, health, power state, and BIOS for a system.
    operationId: getSystem
    method: GET
    path: /Systems/{SystemId}
  - name: Reset System
    description: Power on, off, restart, or cycle a computer system.
    operationId: resetSystem
    method: POST
    path: /Systems/{SystemId}/Actions/ComputerSystem.Reset
  - name: Get BIOS Attributes
    description: Retrieve current BIOS attribute values for a system.
    operationId: getSystemBios
    method: GET
    path: /Systems/{SystemId}/Bios
  - name: Update BIOS Settings
    description: Set pending BIOS attribute values applied on next reboot.
    operationId: updateBiosSettings
    method: PATCH
    path: /Systems/{SystemId}/Bios/Settings
  - name: List Storage Controllers
    description: List storage controller resources for a system.
    operationId: listStorageControllers
    method: GET
    path: /Systems/{SystemId}/Storage
  - name: List Ethernet Interfaces
    description: List Ethernet network interfaces for a system.
    operationId: listEthernetInterfaces
    method: GET
    path: /Systems/{SystemId}/EthernetInterfaces
  - name: List Chassis
    description: List physical chassis resources.
    operationId: listChassis
    method: GET
    path: /Chassis
  - name: Get Chassis Power
    description: Retrieve chassis power supply, consumption, and capping data.
    operationId: getChassisPower
    method: GET
    path: /Chassis/{ChassisId}/Power
  - name: Get Chassis Thermal
    description: Retrieve thermal sensor and fan data for a chassis.
    operationId: getChassisThermal
    method: GET
    path: /Chassis/{ChassisId}/Thermal
  - name: List Managers
    description: List BMC manager resources representing the iDRAC.
    operationId: listManagers
    method: GET
    path: /Managers
  - name: Create Session
    description: Authenticate and create a Redfish session token.
    operationId: createSession
    method: POST
    path: /SessionService/Sessions
  - name: List Firmware Inventory
    description: List installed firmware components and versions.
    operationId: listFirmwareInventory
    method: GET
    path: /UpdateService/FirmwareInventory
  - name: Create Event Subscription
    description: Subscribe to Redfish event notifications.
    operationId: createEventSubscription
    method: POST
    path: /EventService/Subscriptions
  - name: List Metric Reports
    description: List telemetry metric reports for monitoring.
    operationId: listMetricReports
    method: GET
    path: /TelemetryService/MetricReports
use_cases:
  - name: Out-of-band server management
    description: Manage Dell PowerEdge servers regardless of operating system state via the BMC.
  - name: Bare-metal provisioning
    description: Configure BIOS, RAID, and boot order before deploying an operating system.
  - name: Health and inventory monitoring
    description: Continuously poll health status and hardware inventory across a fleet.
  - name: Firmware lifecycle automation
    description: Inventory firmware versions and orchestrate updates across servers.
  - name: Telemetry streaming
    description: Stream power, thermal, and performance telemetry to observability platforms.
  - name: Event-driven alerting
    description: Subscribe to chassis and system events to drive incident response workflows.
