naftiko: 1.0.0-alpha2
info:
  label: Dell Servers Dell iDRAC Redfish REST API — Service Root
  description: 'Dell Servers Dell iDRAC Redfish REST API — Service Root. 1 operations. Lead operation: Dell Servers Get Redfish
    service root. Self-contained Naftiko capability covering one Dell Servers business surface.'
  tags:
  - Dell Servers
  - Service Root
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DELL_SERVERS_API_KEY: DELL_SERVERS_API_KEY
capability:
  consumes:
  - type: http
    namespace: idrac-redfish-service-root
    baseUri: https://{idrac-ip}/redfish/v1
    description: Dell Servers Dell iDRAC Redfish REST API — Service Root business capability. Self-contained, no shared references.
    resources:
    - name: root
      path: /
      operations:
      - name: getserviceroot
        method: GET
        description: Dell Servers Get Redfish service root
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-Auth-Token
      value: '{{env.DELL_SERVERS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: idrac-redfish-service-root-rest
    port: 8080
    description: REST adapter for Dell Servers Dell iDRAC Redfish REST API — Service Root. One Spectral-compliant resource
      per consumed operation, prefixed with /v1.
    resources:
    - path: /v1
      name: root
      description: REST surface for root.
      operations:
      - method: GET
        name: getserviceroot
        description: Dell Servers Get Redfish service root
        call: idrac-redfish-service-root.getserviceroot
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: idrac-redfish-service-root-mcp
    port: 9090
    transport: http
    description: MCP adapter for Dell Servers Dell iDRAC Redfish REST API — Service Root. One tool per consumed operation,
      routed inline through this capability's consumes block.
    tools:
    - name: dell-servers-get-redfish-service
      description: Dell Servers Get Redfish service root
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: idrac-redfish-service-root.getserviceroot
      outputParameters:
      - type: object
        mapping: $.
