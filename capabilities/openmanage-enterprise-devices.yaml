naftiko: 1.0.0-alpha2
info:
  label: Dell Servers Dell OpenManage Enterprise API — Devices
  description: 'Dell Servers Dell OpenManage Enterprise API — Devices. 3 operations. Lead operation: Dell Servers List managed
    devices. Self-contained Naftiko capability covering one Dell Servers business surface.'
  tags:
  - Dell Servers
  - Devices
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DELL_SERVERS_API_KEY: DELL_SERVERS_API_KEY
capability:
  consumes:
  - type: http
    namespace: openmanage-enterprise-devices
    baseUri: https://{ome-server}/api
    description: Dell Servers Dell OpenManage Enterprise API — Devices business capability. Self-contained, no shared references.
    resources:
    - name: DeviceService-Devices
      path: /DeviceService/Devices
      operations:
      - name: listdevices
        method: GET
        description: Dell Servers List managed devices
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: $top
          in: query
          type: integer
          description: Maximum number of devices to return
        - name: $skip
          in: query
          type: integer
          description: Number of devices to skip for pagination
        - name: $filter
          in: query
          type: string
          description: OData filter expression to narrow results. Common filters include Type eq 1000 for servers, Type eq
            2000 for chassis.
        - name: $orderby
          in: query
          type: string
          description: Property name to sort results by
    - name: DeviceService-Devices({DeviceId})
      path: /DeviceService/Devices({DeviceId})
      operations:
      - name: getdevice
        method: GET
        description: Dell Servers Get a managed device
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: DeviceService-Devices({DeviceId})-InventoryDetails
      path: /DeviceService/Devices({DeviceId})/InventoryDetails
      operations:
      - name: getdeviceinventory
        method: GET
        description: Dell Servers Get device inventory details
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-Auth-Token
      value: '{{env.DELL_SERVERS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: openmanage-enterprise-devices-rest
    port: 8080
    description: REST adapter for Dell Servers Dell OpenManage Enterprise API — Devices. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/deviceservice/devices
      name: deviceservice-devices
      description: REST surface for DeviceService-Devices.
      operations:
      - method: GET
        name: listdevices
        description: Dell Servers List managed devices
        call: openmanage-enterprise-devices.listdevices
        with:
          $top: rest.$top
          $skip: rest.$skip
          $filter: rest.$filter
          $orderby: rest.$orderby
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/deviceservice/devices-deviceid
      name: deviceservice-devices-deviceid
      description: REST surface for DeviceService-Devices({DeviceId}).
      operations:
      - method: GET
        name: getdevice
        description: Dell Servers Get a managed device
        call: openmanage-enterprise-devices.getdevice
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/deviceservice/devices-deviceid/inventorydetails
      name: deviceservice-devices-deviceid-inventorydetails
      description: REST surface for DeviceService-Devices({DeviceId})-InventoryDetails.
      operations:
      - method: GET
        name: getdeviceinventory
        description: Dell Servers Get device inventory details
        call: openmanage-enterprise-devices.getdeviceinventory
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: openmanage-enterprise-devices-mcp
    port: 9090
    transport: http
    description: MCP adapter for Dell Servers Dell OpenManage Enterprise API — Devices. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: dell-servers-list-managed-devices
      description: Dell Servers List managed devices
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openmanage-enterprise-devices.listdevices
      with:
        $top: tools.$top
        $skip: tools.$skip
        $filter: tools.$filter
        $orderby: tools.$orderby
      outputParameters:
      - type: object
        mapping: $.
    - name: dell-servers-get-managed-device
      description: Dell Servers Get a managed device
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openmanage-enterprise-devices.getdevice
      outputParameters:
      - type: object
        mapping: $.
    - name: dell-servers-get-device-inventory
      description: Dell Servers Get device inventory details
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: openmanage-enterprise-devices.getdeviceinventory
      outputParameters:
      - type: object
        mapping: $.
