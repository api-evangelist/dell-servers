naftiko: 1.0.0-alpha2
info:
  label: Dell Servers Dell iDRAC Redfish REST API — Accounts
  description: 'Dell Servers Dell iDRAC Redfish REST API — Accounts. 2 operations. Lead operation: Dell Servers Get account
    service. Self-contained Naftiko capability covering one Dell Servers business surface.'
  tags:
  - Dell Servers
  - Accounts
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    DELL_SERVERS_API_KEY: DELL_SERVERS_API_KEY
capability:
  consumes:
  - type: http
    namespace: idrac-redfish-accounts
    baseUri: https://{idrac-ip}/redfish/v1
    description: Dell Servers Dell iDRAC Redfish REST API — Accounts business capability. Self-contained, no shared references.
    resources:
    - name: AccountService
      path: /AccountService
      operations:
      - name: getaccountservice
        method: GET
        description: Dell Servers Get account service
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: AccountService-Accounts
      path: /AccountService/Accounts
      operations:
      - name: listaccounts
        method: GET
        description: Dell Servers List user accounts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: apikey
      key: X-Auth-Token
      value: '{{env.DELL_SERVERS_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: idrac-redfish-accounts-rest
    port: 8080
    description: REST adapter for Dell Servers Dell iDRAC Redfish REST API — Accounts. One Spectral-compliant resource per
      consumed operation, prefixed with /v1.
    resources:
    - path: /v1/accountservice
      name: accountservice
      description: REST surface for AccountService.
      operations:
      - method: GET
        name: getaccountservice
        description: Dell Servers Get account service
        call: idrac-redfish-accounts.getaccountservice
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/accountservice/accounts
      name: accountservice-accounts
      description: REST surface for AccountService-Accounts.
      operations:
      - method: GET
        name: listaccounts
        description: Dell Servers List user accounts
        call: idrac-redfish-accounts.listaccounts
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: idrac-redfish-accounts-mcp
    port: 9090
    transport: http
    description: MCP adapter for Dell Servers Dell iDRAC Redfish REST API — Accounts. One tool per consumed operation, routed
      inline through this capability's consumes block.
    tools:
    - name: dell-servers-get-account-service
      description: Dell Servers Get account service
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: idrac-redfish-accounts.getaccountservice
      outputParameters:
      - type: object
        mapping: $.
    - name: dell-servers-list-user-accounts
      description: Dell Servers List user accounts
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: idrac-redfish-accounts.listaccounts
      outputParameters:
      - type: object
        mapping: $.
