description: Machine-readable plans and pricing scaffold for this API provider. Conforms to the API Commons
  Plans schema. Tier limits and prices are scaffold defaults; replace with provider-published values.
plans:
  - id: dell-servers-free
    name: Free
    type: freemium
    description: Free entry tier for the Dell Servers API surface. Intended for evaluation, prototyping,
      and low-volume integrations. Real limits and pricing must be reconciled with the provider's published
      plan documentation.
    entries:
      - label: API Requests
        description: Monthly API request quota across all included endpoints
        name: api_requests
        type: quota
        metric: requests
        limit: 1000
        timeFrame: month
        geo: global
        domains:
          - https://{idrac-ip}/redfish/v1
          - https://{ome-server}/api
          - https://{omem-server}/api
          - https://{omivv-server}/api
          - https://{idrac-ip}/redfish/v1/SSE
          - https://{idrac-ip}/wsman
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: Rate Limit
        description: Maximum requests per minute on the free tier
        name: rate_limit
        type: rate
        metric: requests_per_minute
        limit: 10
        timeFrame: minute
        geo: global
        domains:
          - https://{idrac-ip}/redfish/v1
          - https://{ome-server}/api
          - https://{omem-server}/api
          - https://{omivv-server}/api
          - https://{idrac-ip}/redfish/v1/SSE
          - https://{idrac-ip}/wsman
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Public Documentation
      - name: Community Support
      - name: Sandbox Access
      - name: Dell iDRAC Redfish REST API
      - name: Dell OpenManage Enterprise API
      - name: Dell OpenManage Enterprise Modular API
      - name: Dell OpenManage Enterprise Power Manager API
      - name: Dell OpenManage Enterprise SupportAssist API
      - name: Dell OpenManage Integration for VMware vCenter API
      - name: Dell iDRAC Telemetry Streaming API
      - name: Dell Lifecycle Controller Remote Services API
  - id: dell-servers-pro
    name: Professional
    type: paid
    description: Production tier for Dell Servers. Provides higher quotas, priority support, and access
      to the broader API portfolio. Pricing placeholder; align with the provider's pricing page.
    entries:
      - label: API Requests
        description: Monthly API request quota
        name: api_requests
        type: quota
        metric: requests
        limit: 100000
        timeFrame: month
        geo: global
        domains:
          - https://{idrac-ip}/redfish/v1
          - https://{ome-server}/api
          - https://{omem-server}/api
          - https://{omivv-server}/api
          - https://{idrac-ip}/redfish/v1/SSE
          - https://{idrac-ip}/wsman
        unit: 1
        price: TBD
        userMultiplied: false
      - label: Rate Limit
        description: Maximum requests per minute on the professional tier
        name: rate_limit
        type: rate
        metric: requests_per_minute
        limit: 100
        timeFrame: minute
        geo: global
        domains:
          - https://{idrac-ip}/redfish/v1
          - https://{ome-server}/api
          - https://{omem-server}/api
          - https://{omivv-server}/api
          - https://{idrac-ip}/redfish/v1/SSE
          - https://{idrac-ip}/wsman
        unit: 1
        price: '0.00'
        userMultiplied: false
