        description: Per-request price after monthly quota is exceeded
        name: overage
        type: metered
        metric: requests
        limit: -1
        timeFrame: month
        geo: global
        domains:
          - https://{idrac-ip}/redfish/v1
          - https://{ome-server}/api
          - https://{omem-server}/api
          - https://{omivv-server}/api
          - https://{idrac-ip}/redfish/v1/SSE
          - https://{idrac-ip}/wsman
