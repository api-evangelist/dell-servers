specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Dell Servers
providerId: dell-servers
created: '2026-05-04'
# Provenance stamped 2026-08-11: this artifact was written by the API Evangelist
# bulk sweep dated 2026-05-04, not harvested from the provider. See roadmap#35.
method: generated
modified: '2026-05-05'
reconciled: false
tags:
  - Hardware
  - Infrastructure
  - Server Management
  - Redfish
description: The Dell PowerEdge server management APIs (iDRAC Redfish, Lifecycle Controller,
  RACADM, WSMan) are firmware-resident interfaces shipped with the server hardware at no additional
  per-call charge. Some advanced features (e.g. iDRAC Datacenter / iDRAC9 Enterprise tier features,
  OpenManage Enterprise Power Manager, OpenManage Enterprise Advanced) require a paid iDRAC
  license tier or an OpenManage Enterprise plug-in license per managed node — those are sold
  separately by Dell or via channel partners. Dell does not publish a public per-call API price
  list; the cost is embedded in the hardware purchase plus optional license SKUs.
sources:
  - https://developer.dell.com/apis/2978/versions/8.x/openapi.yaml
  - https://www.dell.com/support/kbdoc/en-us/000178027/idrac-licenses
  - https://www.dell.com/en-us/dt/solutions/openmanage/index.htm
notes: APIs ship with the hardware — no per-call billing. Pricing is embedded in the iDRAC
  license tier (Express, Enterprise, Datacenter) and the OpenManage Enterprise edition plus
  per-node plug-in licenses (Power Manager, SupportAssist, etc.). Reconciled false because
  per-license SKU pricing is channel-quoted and not publicly listed.
plans:
  - id: dell-idrac-included
    name: iDRAC Express (included)
    type: freemium
    description: Baseline out-of-band management included with every PowerEdge server. Provides
      Redfish REST API, basic monitoring, and IPMI. No additional cost.
    entries:
      - label: iDRAC Express license
        name: idrac_express
        type: flat
        metric: server
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
    elements:
      - name: Bundled with PowerEdge servers
      - name: Dell iDRAC Redfish REST API (basic)
      - name: IPMI 2.0
      - name: Dell RACADM CLI
      - name: Dell WSMan API
      - name: Dell Lifecycle Controller Remote Services API (basic)
  - id: dell-idrac-enterprise
    name: iDRAC Enterprise / Datacenter
    type: subscription
    description: Paid iDRAC license tiers (Enterprise, Datacenter) that unlock advanced features
      such as virtual console, virtual media, telemetry streaming, group manager, and thermal
      analytics. Sold per-server through Dell or channel partners.
    entries:
      - label: iDRAC Enterprise / Datacenter license
        name: idrac_enterprise_license
        type: flat
        metric: server
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: contact dell
        userMultiplied: false
    elements:
      - name: Virtual console and virtual media
      - name: Dell iDRAC Telemetry Streaming API
      - name: Group Manager
      - name: Thermal analytics
      - name: Advanced Redfish endpoints
  - id: dell-openmanage-enterprise
    name: OpenManage Enterprise
    type: subscription
    description: OpenManage Enterprise (OME) is Dell's centralized server management console.
      The base OME software is free to download; advanced plug-ins (Power Manager, SupportAssist,
      Update Manager, Modular for PowerEdge MX, OMIVV for VMware) are licensed per managed node
      and quoted by Dell.
    entries:
      - label: OME base software
        name: ome_base
        type: flat
        metric: server
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: '0.00'
        userMultiplied: false
      - label: OME plug-in licenses
        name: ome_plugins
        type: subscription
        metric: managed-node
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact dell
        userMultiplied: false
    elements:
      - name: Dell OpenManage Enterprise API
      - name: Dell OpenManage Enterprise Modular API
      - name: Dell OpenManage Enterprise Power Manager API
      - name: Dell OpenManage Enterprise SupportAssist API
      - name: Dell OpenManage Integration for VMware vCenter API
